# OpenBite's trunk gets the checks the pre-push hook runs, the strict way (a process a file),
# on a machine that isn't this one: a push with --no-verify, or from a clone without the hooks,
# still gets checked, and a failure only a strict run shows appears the day it comes in.
# A nightly run wouldn't work here: schedules run on the default branch, which is upstream's main.
name: Fork checks

on:
  push:
    branches: [fork/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-checks
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Upstream, for the seam check
        run: |
          git remote add upstream https://github.com/simonoppowa/OpenNutriTracker.git
          git fetch -q upstream main
      - name: Install Flutter
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')"
          git clone -q --depth 1 -b "$version" https://github.com/flutter/flutter.git "$HOME/flutter"
          "$HOME/flutter/bin/flutter" --version
      - name: Stub keys and generated code
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          cp .env.example .env
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
      - run: fork/tools/verify.sh --strict

  # The release gate's scan (fork/tools/release-check.sh), so a known vulnerability shows up with
  # the next push and not only at the next release. Dependabot can't do this: it reads the default
  # branch, upstream's main, whose lockfiles aren't the fork's. A failure blocks nothing; GitHub
  # sends its usual failed-run email.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Trivy
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
      - name: Known vulnerabilities
        run: |
          "$RUNNER_TEMP/trivy" fs . --scanners vuln --include-dev-deps --skip-dirs build \
            --skip-dirs flutter --ignorefile fork/security/trivyignore.yaml --exit-code 1
