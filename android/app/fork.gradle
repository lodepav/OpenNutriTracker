// The fork's own identity (D8): OpenBite, with its own app id, so it installs beside the
// official app. Applied by seam S20, the last line of build.gradle.
// OpenBite's own version (D16): fork/VERSION, written by fork/tools/release-apk.sh, not upstream's
// pubspec version, which the About screen names as the base. versionCode 0.1.0 = 100.
def forkVersion = rootProject.file('../fork/VERSION').text.trim()
def (forkMajor, forkMinor, forkPatch) = forkVersion.tokenize('.').collect { it as int }

android {
    defaultConfig {
        applicationId "io.github.lodepav.openbite"
        versionName forkVersion
        versionCode forkMajor * 10000 + forkMinor * 100 + forkPatch
    }
    // Without upstream's android/key.properties the release build is unsigned, and
    // fork/tools/release-apk.sh signs it: the key never enters Gradle (D16).
    if (!rootProject.file('key.properties').exists()) {
        buildTypes.release.signingConfig null
    }
    // The launcher name and icon (S34). Variant source sets outrank upstream's flavour ones, so these
    // override src/main's and src/develop's app_name without editing them.
    sourceSets {
        // The fork's own Android code: the backup folder's channel (S22), the updater's (S76).
        main.java.srcDirs += 'src/fork/kotlin'
        // The macro widget's layout and look (S50).
        main.res.srcDirs += 'src/fork/widget/res'
        fullDebug.res.srcDirs += ['src/fork/full/res', 'src/fork/icon/res']
        fullProfile.res.srcDirs += ['src/fork/full/res', 'src/fork/icon/res']
        fullRelease.res.srcDirs += ['src/fork/full/res', 'src/fork/icon/res', 'src/fork/update/res']
        // The in-app updater's permission and provider (S76): the release build only.
        fullRelease.manifest.srcFile 'src/fork/update/AndroidManifest.xml'
        developDebug.res.srcDirs += ['src/fork/develop/res', 'src/fork/icon/res']
        developProfile.res.srcDirs += ['src/fork/develop/res', 'src/fork/icon/res']
        developRelease.res.srcDirs += ['src/fork/develop/res', 'src/fork/icon/res']
    }
}
